# GPT-6.1 Sol · medium · 3 types × 100 problems
# source ./keys.sh openai
# .venv/bin/python run.py --profile sol
config_version = 1
default_profile = "sol"

[experiment]
dataset = "../data/benchmark_300.json"
problems = 300
start_problem = 1
T = 10
k = 2
r1_apply_k = true
max_output_tokens = 25000
timeout = 180.0
feedback_policy = "goal_rule_4way_v1"

[profiles.sol]
label = "GPT-6.1 Sol · medium"
provider = "openai"
model = "gpt-6.1-sol"
effort = "medium"
