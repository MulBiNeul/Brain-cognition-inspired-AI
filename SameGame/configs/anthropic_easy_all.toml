# Same evaluation settings; use the separate dataset with easier rounds throughout each problem.
config_version = 1
default_profile = "opus"

[experiment]
dataset = "../data/easy_all/problems.json"
max_attempts = 10
required_streak = 2
max_output_tokens = 25000
timeout = 600.0

[profiles.opus]
label = "Claude Opus 5.5 · medium · 전체 완화"
provider = "anthropic"
model = "claude-opus-5-5"
effort = "medium"

[profiles.sonnet]
label = "Claude Sonnet 5.5 · medium · 전체 완화"
provider = "anthropic"
model = "claude-sonnet-5-5"
effort = "medium"
