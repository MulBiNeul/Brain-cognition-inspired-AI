# Same evaluation settings; use the separate dataset with easier rounds throughout each problem.
config_version = 1
default_profile = "sol"

[experiment]
dataset = "../data/easy_all/problems.json"
max_attempts = 10
required_streak = 2
max_output_tokens = 25000
timeout = 600.0

[profiles.sol]
label = "GPT-6.1 Sol · medium · 전체 완화"
provider = "openai"
model = "gpt-6.1-sol"
effort = "medium"
