# Rerun only the 25 same-letter items with the corrected all-round dataset.
config_version = 1
default_profile = "opus"

[experiment]
dataset = "../data/easy_same_letter_v2/same_letter/problems.json"
max_attempts = 10
required_streak = 2
max_output_tokens = 25000
timeout = 600.0

[profiles.opus]
label = "Claude Opus 5.5 · medium · 같은 문자 유형 수정"
provider = "anthropic"
model = "claude-opus-5-5"
effort = "medium"

[profiles.sonnet]
label = "Claude Sonnet 5.5 · medium · 같은 문자 유형 수정"
provider = "anthropic"
model = "claude-sonnet-5-5"
effort = "medium"
